<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PocketPlan — Reports → By Category mock</title>
<style>
:root {
  --accent: #1F7A8C;
  --warning: #E0A92A; --danger: #C0392B;
  --surface: #FFFFFF; --surface-muted: #F5F7F8;
  --border: #E3E7E8;
  --text: #0F1B1F; --text-muted: #5C6B70; --text-inverse: #FFFFFF;
  --radius-md: 8px; --radius-lg: 12px; --radius-pill: 9999px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px;
  --font: Inter, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font); font-size: 16px; line-height: 24px;
  color: var(--text); background: var(--surface-muted);
  -webkit-font-smoothing: antialiased;
}
.phone {
  width: 375px; min-height: 812px; margin: 24px auto;
  background: var(--surface-muted); border: 1px solid var(--border);
  border-radius: 32px; overflow: hidden; position: relative;
}
.statusbar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 14px; font-weight: 600; }
.appbar {
  height: 56px; background: var(--surface-muted);
  display: flex; align-items: center; gap: var(--s3);
  padding: 0 var(--s4); border-bottom: 1px solid var(--border);
}
.back {
  background: transparent; border: 0; cursor: pointer;
  font-size: 18px; color: var(--accent); padding: var(--s2);
  font-family: inherit;
}
.appbar h1 { font-size: 16px; font-weight: 600; margin: 0; flex: 1; }

.tabs {
  display: flex; gap: var(--s2);
  padding: var(--s4) var(--s4) var(--s2);
  overflow-x: auto;
}
.tabs::-webkit-scrollbar { display: none; }
.tab-pill {
  flex: 0 0 auto;
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  background: var(--surface);
  font-size: 14px;
  cursor: pointer;
}
.tab-pill.active {
  border-color: var(--accent); color: var(--accent);
  background: rgba(31,122,140,0.06);
  font-weight: 600;
}

.content { padding: 0 var(--s4) var(--s8); }

.summary-card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: var(--s5);
  margin-bottom: var(--s4);
  box-shadow: 0 1px 2px rgba(15,27,31,0.06);
  text-align: center;
}
.summary-card .label { font-size: 14px; color: var(--text-muted); margin-bottom: var(--s2); }
.summary-card .amount {
  font-family: var(--mono);
  font-size: 32px; line-height: 40px; font-weight: 700;
  margin-bottom: var(--s2);
}
.summary-card .sub { font-size: 14px; color: var(--text-muted); }

.section-title {
  font-size: 14px; font-weight: 600;
  color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;
  margin: var(--s4) 0 var(--s3);
}

.cat-row {
  background: var(--surface);
  padding: var(--s3) var(--s4);
  display: flex; align-items: center; gap: var(--s3);
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.cat-row:first-of-type { border-top-left-radius: var(--radius-lg); border-top-right-radius: var(--radius-lg); }
.cat-row:last-of-type { border-bottom-left-radius: var(--radius-lg); border-bottom-right-radius: var(--radius-lg); border-bottom: 0; }
.cat-row .icon {
  width: 40px; height: 40px;
  background: var(--surface-muted);
  border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.cat-row .text { flex: 1; min-width: 0; }
.cat-row .text strong { display: block; font-size: 16px; font-weight: 600; }
.cat-row .text .bar {
  height: 6px; background: var(--surface-muted);
  border-radius: var(--radius-pill);
  margin-top: 6px;
  overflow: hidden;
}
.cat-row .text .bar-fill { height: 100%; border-radius: var(--radius-pill); }
.cat-row.warn .bar-fill { background: var(--warning); }
.cat-row.danger .bar-fill { background: var(--danger); }
.cat-row.norm .bar-fill { background: var(--accent); }
.cat-row .amount {
  font-family: var(--mono);
  font-size: 16px; font-weight: 600;
  flex-shrink: 0;
  text-align: right;
}
.cat-row .amount .pct {
  display: block; font-size: 12px; color: var(--text-muted);
  font-weight: 400;
}

.tabbar {
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 64px; background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
}
.tab {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  font-size: 12px; color: var(--text-muted); position: relative;
}
.tab.active { color: var(--accent); font-weight: 600; }
.tab.active::before {
  content: ""; position: absolute; top: 0; left: 25%; right: 25%;
  height: 3px; background: var(--accent);
}
.tab .icon { font-size: 20px; }
.tab .badge { position: absolute; top: 8px; right: 30%; width: 8px; height: 8px; background: #C0392B; border-radius: 50%; }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span>•••</span></div>
  <div class="appbar">
    <button class="back">‹</button>
    <h1>Reports</h1>
  </div>

  <div class="tabs">
    <div class="tab-pill active">By Category</div>
    <div class="tab-pill">By Account</div>
    <div class="tab-pill">Trend</div>
    <div class="tab-pill">Savings</div>
  </div>

  <div class="content">
    <!-- Summary -->
    <div class="summary-card">
      <div class="label">Total spent · August</div>
      <div class="amount">৳24,500</div>
      <div class="sub">70% of ৳35,000 budgeted</div>
    </div>

    <div class="section-title">By category</div>

    <!-- Transport — 95% (warn) -->
    <div class="cat-row warn">
      <div class="icon">🚗</div>
      <div class="text">
        <strong>Transport</strong>
        <div class="bar"><div class="bar-fill" style="width: 95%"></div></div>
      </div>
      <div class="amount">
        ৳4,750
        <span class="pct">95%</span>
      </div>
    </div>

    <!-- Shopping — 113% (danger) -->
    <div class="cat-row danger">
      <div class="icon">🛍️</div>
      <div class="text">
        <strong>Shopping</strong>
        <div class="bar"><div class="bar-fill" style="width: 100%"></div></div>
      </div>
      <div class="amount">
        ৳3,400
        <span class="pct">113%</span>
      </div>
    </div>

    <!-- Food — 50% (normal) -->
    <div class="cat-row norm">
      <div class="icon">🍔</div>
      <div class="text">
        <strong>Food</strong>
        <div class="bar"><div class="bar-fill" style="width: 50%"></div></div>
      </div>
      <div class="amount">
        ৳6,000
        <span class="pct">50%</span>
      </div>
    </div>

    <!-- Bills — 80% -->
    <div class="cat-row warn">
      <div class="icon">🧾</div>
      <div class="text">
        <strong>Bills</strong>
        <div class="bar"><div class="bar-fill" style="width: 80%"></div></div>
      </div>
      <div class="amount">
        ৳4,000
        <span class="pct">80%</span>
      </div>
    </div>

    <!-- Health — 40% -->
    <div class="cat-row norm">
      <div class="icon">⚕️</div>
      <div class="text">
        <strong>Health</strong>
        <div class="bar"><div class="bar-fill" style="width: 40%"></div></div>
      </div>
      <div class="amount">
        ৳800
        <span class="pct">40%</span>
      </div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab"><div class="icon">⌂</div>Home</div>
    <div class="tab"><div class="icon">≡</div>Expenses</div>
    <div class="tab"><div class="icon">◔</div>Budgets</div>
    <div class="tab active"><div class="icon">▤</div>Reports</div>
    <div class="tab"><div class="icon">•••</div>More<span class="badge"></span></div>
  </div>
</div>
</body>
</html>
